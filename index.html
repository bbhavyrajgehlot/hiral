<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Hiral</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* Start Screen */
        .start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            color: #fff;
            background: linear-gradient(45deg, #ff0066, #ff4081);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255,0,102,0.4);
            animation: pulseBtn 1.5s infinite;
            transition: transform 0.2s;
        }

        .start-btn:hover { transform: scale(1.1); }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 10px 20px rgba(255,0,102,0.4); }
            50% { box-shadow: 0 15px 30px rgba(255,0,102,0.8); }
        }

        /* Hearts */
        .heart {
            position: absolute;
            width: 20px; height: 20px;
            background: #ff0066;
            transform: rotate(-45deg);
            animation: float 6s ease-in infinite;
            opacity: 0;
        }
        .heart:before, .heart:after {
            content: ""; position: absolute;
            width: 20px; height: 20px;
            background: inherit; border-radius: 50%;
        }
        .heart:before { top: -10px; left: 0; }
        .heart:after { left: 10px; top: 0; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(-45deg) scale(0); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(-45deg) scale(1.2); opacity: 0; }
        }

        /* Balloons */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px; height: 50px;
            border-radius: 50%;
            animation: floatUp 8s linear infinite;
            opacity: 0.9;
        }
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -40px; left: 50%;
            width: 2px; height: 40px;
            background: rgba(255,255,255,0.5);
            transform: translateX(-50%);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-110vh) rotate(15deg); opacity: 0; }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            top: -10px;
            animation: confettiFall 4s linear infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotateZ(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotateZ(720deg); opacity: 0.5; }
        }

        /* Birthday Text */
        .birthday-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .birthday-text.show { opacity: 1; }

        .birthday-text h1 {
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            margin-bottom: 10px;
            animation: pulseText 2s infinite;
        }

        .birthday-text h2 {
            font-size: 4rem;
            background: linear-gradient(45deg, #ffeb3b, #ff9800, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 0 10px rgba(255, 152, 0, 0.5));
        }

        .cake-emoji {
            font-size: 5rem;
            display: block;
            margin-bottom: 20px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <!-- Audio Element (Music ke liye) -->
    <audio id="bgMusic" loop>
        <!-- Niche diye gaye instructions padhein music file add karne ke liye -->
        <source src="happy-birthday.mp3" type="audio/mpeg">
    </audio>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <button class="start-btn" id="startBtn">🎁 Click to Celebrate! 🎁</button>
    </div>

    <!-- Main Content -->
    <div class="birthday-text" id="mainText">
        <span class="cake-emoji">🎂</span>
        <h1>🎉 Happy Birthday 🎉</h1>
        <h2>✨ Hiral ✨</h2>
    </div>

    <script>
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const bgMusic = document.getElementById('bgMusic');
        const mainText = document.getElementById('mainText');

        // Jab user button click kare
        startBtn.addEventListener('click', () => {
            // Start screen hide karein
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 1000);

            // Music play karein
            bgMusic.volume = 0.5;
            bgMusic.play().catch(e => console.log("Audio play failed, please ensure music file exists."));

            // Text show karein
            setTimeout(() => mainText.classList.add('show'), 500);

            // Animations start karein
            startAnimations();
        });

        function startAnimations() {
            // 1. Hearts banayein
            setInterval(createHeart, 300);

            // 2. Balloons banayein
            setInterval(createBalloon, 800);

            // 3. Confetti banayein
            setInterval(createConfetti, 100);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            const colors = ['#ff0066', '#ff4081', '#e91e63', '#f06292', '#ff80ab'];
            heart.style.background = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 8000);
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.left = Math.random() * 100 + '%';
            balloon.style.animationDuration = (Math.random() * 4 + 6) + 's';
            const colors = ['#ff5252', '#ff4081', '#7c4dff', '#448aff', '#64ffda', '#ffeb3b'];
            balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(balloon);
            setTimeout(() => balloon.remove(), 10000);
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
            confetti.style.width = (Math.random() * 8 + 5) + 'px';
            confetti.style.height = (Math.random() * 8 + 5) + 'px';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 5000);
        }
    </script>
</body>
</html>
